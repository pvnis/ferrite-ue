# Build for the host CPU: enables AVX2 + FMA (and host tuning) so the compiler can
# auto-vectorize scalar loops and use fused multiply-add. NOTE: `target-cpu=native`
# bakes in the build host's ISA — the resulting binary will SIGILL on an older CPU.
# The LDPC decoder does not rely on this flag (it runtime-detects AVX2 and dispatches
# to a hand-written path with a portable scalar fallback); this is the free win for
# everything else. For a portable build, swap to: target-feature=+avx2,+fma
[build]
rustflags = ["-C", "target-cpu=native"]

# The `zmq` crate (via zmq-sys -> zeromq-src) always compiles libzmq from
# source with the `cc` crate and does not run libzmq's configure checks.
# Without HAVE_POSIX_MEMALIGN, libzmq's yqueue_t allocates its 64-byte-aligned
# command chunks with plain malloc; compilers that emit aligned AVX stores for
# the copy then fault (SIGSEGV in zmq::mailbox_t::send, seen on GitHub's
# Ubuntu 26.04 runners).  Defining it restores the posix_memalign path that
# every distro build of libzmq uses.
[env]
CXXFLAGS = "-DHAVE_POSIX_MEMALIGN=1 -DZMQ_CACHELINE_SIZE=64"

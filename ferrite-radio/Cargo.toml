[package]
name = "ferrite-radio"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
ferrite-common.workspace = true
num-complex.workspace = true
soapysdr = { version = "0.5", optional = true }
zmq = { version = "0.10", optional = true }

[features]
default = []
# SoapySDR backend (LimeSDR via LimeSuiteNG, BladeRF, USRP via UHD, M2SDR, …).
# Requires libSoapySDR and pkg-config.
soapy = ["dep:soapysdr"]
# ZMQ IQ-transport backend, for a gNB exposing baseband over ZeroMQ
# (srsRAN/OCUDU-compatible REQ/REP protocol).
zmq = ["dep:zmq"]

[[example]]
name = "sdr_probe"
required-features = ["soapy"]

[[example]]
name = "tx_verify"
required-features = ["soapy"]

[[example]]
name = "tx_rate"
required-features = ["soapy"]

[[example]]
name = "tx_rx_cal"
required-features = ["soapy"]

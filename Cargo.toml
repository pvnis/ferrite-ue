[workspace]
resolver = "2"
members = [
    "ferrite-common",
    "ferrite-ran",
    "ferrite-fapi",
    "ferrite-security",
    "ferrite-phy",
    "ferrite-radio",
    "ferrite-asn1",
    "ferrite-rlc",
    "ferrite-pdcp",
    "ferrite-nas",
    "ferrite-rrc",
    "ferrite-mac",
    "ferrite-l1",
    "ferrite-ue",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
authors = ["Ferrite contributors"]

[workspace.dependencies]
num-complex = "0.4"
rustfft = "6"
thiserror = "2"
crossbeam-channel = "0.5"
rayon = "1"
log = "0.4"
env_logger = "0.11"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
clap = { version = "4", features = ["derive"] }
aes = "0.8"
cmac = "0.7"
ctr = "0.9"
sha2 = "0.10"
hmac = "0.12"
libc = "0.2"

ferrite-common = { path = "ferrite-common" }
ferrite-ran = { path = "ferrite-ran" }
ferrite-fapi = { path = "ferrite-fapi" }
ferrite-security = { path = "ferrite-security" }
ferrite-phy = { path = "ferrite-phy" }
ferrite-radio = { path = "ferrite-radio" }
ferrite-asn1 = { path = "ferrite-asn1" }
ferrite-rlc = { path = "ferrite-rlc" }
ferrite-pdcp = { path = "ferrite-pdcp" }
ferrite-nas = { path = "ferrite-nas" }
ferrite-rrc = { path = "ferrite-rrc" }
ferrite-mac = { path = "ferrite-mac" }
ferrite-l1 = { path = "ferrite-l1" }

# Optimize dependencies even in debug builds; the DSP inner loops are unusably
# slow otherwise.
[profile.dev.package."*"]
opt-level = 3

# `cfg(kani)`: model-checking harnesses (`cargo kani`), see ferrite_common::fsm.
[workspace.lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(kani)'] }

# CLAUDE.md: no unwrap / expect / panic in non-test code (tests are exempt
# through clippy.toml; examples, benches and integration-test helpers opt
# out at their crate root).
[workspace.lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"

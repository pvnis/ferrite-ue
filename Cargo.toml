[workspace]
resolver = "2"
members = [
    "ferrite-common",
    "ferrite-phy",
    "ferrite-mac",
    "ferrite-radio",
    "ferrite-ue",
]

[workspace.package]
version = "0.0.1"
edition = "2021"
license = "MIT OR Apache-2.0"
authors = ["Ferrite contributors"]

[workspace.dependencies]
num-complex = "0.4"
rustfft = "6"
thiserror = "2"
crossbeam-channel = "0.5"
rayon = "1"

ferrite-common = { path = "ferrite-common" }
ferrite-phy = { path = "ferrite-phy" }
ferrite-mac = { path = "ferrite-mac" }
ferrite-radio = { path = "ferrite-radio" }
ferrite-ue = { path = "ferrite-ue" }

# Optimize dependencies even in debug builds; the DSP inner loops are unusably
# slow otherwise.
[profile.dev.package."*"]
opt-level = 3

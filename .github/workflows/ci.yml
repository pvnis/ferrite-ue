name: CI

on:
  push:
    branches: [master]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  check:
    name: build, clippy, tests
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: System packages (ZMQ radio backend)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libzmq3-dev pkg-config
      - name: Build
        run: cargo build --workspace --release --all-targets
      - name: Clippy
        run: cargo clippy --workspace --release --all-targets
      - name: Tests
        # The DSP tests are far too slow unoptimised; the dev profile already
        # optimises dependencies, release is needed for the workspace crates.
        run: cargo test --workspace --release
      - name: Docs
        run: cargo doc --workspace --no-deps --document-private-items
        env:
          RUSTDOCFLAGS: -D warnings

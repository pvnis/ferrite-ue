ferrite-pdcp.workspace = true
ferrite-nas.workspace = true
ferrite-rrc.workspace = true
ferrite-mac.workspace = true
ferrite-l1.workspace = true
ferrite-fapi.workspace = true
ferrite-ran.workspace = true
num-complex.workspace = true
crossbeam-channel.workspace = true
log.workspace = true
env_logger.workspace = true
serde.workspace = true
toml.workspace = true
clap.workspace = true
libc.workspace = true


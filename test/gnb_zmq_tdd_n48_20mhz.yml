# OCUDU gNB config for Ferrite UE over ZMQ — band n48 (US CBRS), 20 MHz at
# 3600 MHz, 30 kHz SCS, a two-pattern 5 ms TDD period DDDSU + DDSUU
# (TDD-UL-DL-ConfigCommon pattern1 + pattern2).
# Same as gnb_zmq_tdd_n78_10mhz.yml (T1: ZMQ ports 2100/2101, NGAP/GTP bind
# 127.0.0.20, gnb_id 333, shared qcore AMF, SRS, SIB2, measurement reports)
# except for the band and TDD pattern below.
#
# Run:   /home/dmd/ocudu-pavo/build/apps/gnb/gnb -c /home/dmd/ferrite-ue/test/gnb_zmq_tdd_n48_20mhz.yml

gnb_id: 333

cu_cp:
  # Measurement reporting (the UE must decode measConfig and send
  # MeasurementReport): a periodical report of the serving cell.
  mobility:
    trigger_handover_from_measurements: false
    cells:
      - nr_cell_id: 0x534000
        periodic_report_cfg_id: 1
    report_configs:
      - report_cfg_id: 1
        report_type: periodical
        report_interval_ms: 1024
  # Release the UE to idle after 5 s without traffic (exercises RRC release,
  # service request and paging; the ping rounds in the lab are spaced wider).
  inactivity_timer: 5
  amf:
    # For SIB1-only bring-up without the core, set `no_core: true` (the cell
    # then broadcasts SSB/SIB1 without NGAP). For UE attach, leave it pointed at
    # the shared qcore AMF below and make sure qcore is running.
    # no_core: true          # standalone (RACH/Msg3 PHY test); commented → qcore
    addr: 127.0.0.1          # shared qcore AMF
    bind_addr: 127.0.0.20    # unique local bind (NGAP + GTP-U 127.0.0.20:2152)
    supported_tracking_areas:
      -
        tac: 7               # must match qcore (TAC 7)
        plmn_list:
          -
            plmn: "00101"
            tai_slice_support_list:
              -
                sst: 1
                sd: 0

ru_sdr:
 device_driver: zmq
 device_args: tx_port=tcp://127.0.0.1:2100,rx_port=tcp://127.0.0.1:2101,base_srate=30.72e6
 srate: 30.72
 tx_gain: 0
 rx_gain: 0

cell_cfg:
 dl_arfcn: 640000
 band: 48
 channel_bandwidth_MHz: 20
 common_scs: 30
 plmn: "00101"
 tac: 7                       # must match qcore (TAC 7)
 slicing:
 - sst: 1
   sd: 0
 pci: 1
 tdd_ul_dl_cfg:
  # pattern1 DDDSU (2.5 ms) + pattern2 DDSUU (2.5 ms) = DDDSUDDSUU.
  dl_ul_tx_period: 5
  nof_dl_slots: 3
  nof_dl_symbols: 6
  nof_ul_slots: 1
  nof_ul_symbols: 4
  pattern2:
   dl_ul_tx_period: 5
   nof_dl_slots: 2
   nof_dl_symbols: 8
   nof_ul_slots: 2
   nof_ul_symbols: 2
 nof_antennas_ul: 1
 nof_antennas_dl: 1
 pdsch:
  # The 64-QAM MCS table; no MCS cap (link adaptation runs from the UE's
  # CQI, 64-QAM both ways).
  mcs_table: qam64
 pusch:
  mcs_table: qam64
 # PUCCH: at 20 MHz (carrier_bw > 10) the gNB uses the full-width PUCCH layout;
 # just shorten the SR period (5 ms) to keep the idle-UE ping RTT down.
 pucch:
  sr_period_ms: 5
 prach:
  prach_config_index: 159
 # Periodic SRS for every UE (the UE sounds on its configured occasions).
 srs:
  type_enabled: periodic
  period_ms: 20
 # Broadcast SIB2 in one SI message every 32 frames (the UE acquires other SI
 # from the si-SchedulingInfo windows).
 sib:
  si_window_length: 20
  si_sched_info:
   - si_period: 32
     sib_mapping: [2]
  sib2:
   q_hyst: 3
   thresh_serving_low_p: 0
   cell_reselection_priority: 6
   q_rx_lev_min: -140
   s_intra_search_p: 62
   t_reselection_nr: 1

log:
 filename: /tmp/ferrite_gnb_zmq.log
 rrc_level: debug
 all_level: info
 lib_level: info
 fapi_level: debug
 mac_level: debug
 ngap_level: debug
 f1ap_level: debug
 phy_level: debug
 broadcast_enabled: true
 hex_max_size: 1024

metrics:
 autostart_stdout_metrics: 1
